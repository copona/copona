name: Screenshots

# Boots the demo store, captures the README screenshots and commits them to
# docs/screenshots/ on the branch the workflow ran on. Run it manually from
# the Actions tab after UI changes; it also runs on feature-branch pushes that
# change the capture script itself.
on:
  workflow_dispatch:
  push:
    branches-ignore: [master]
    paths:
      - .github/workflows/screenshots.yml
      - .github/scripts/screenshots.cjs

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:12.3.2
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: copona
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=24

    env:
      DB_DRIVER: mysqli
      DB_HOSTNAME: 127.0.0.1
      DB_DATABASE: copona
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_PORT: 3306
      DB_PREFIX: cp_
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      ADMIN_EMAIL: admin@example.com

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-store
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save playwright@1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium

      - name: Capture screenshots
        run: NODE_PATH="$RUNNER_TEMP/pw/node_modules" node .github/scripts/screenshots.cjs http://127.0.0.1:8000 docs/screenshots

      - name: Commit screenshots
        run: |
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update README screenshots"
          git push

      - name: Show logs on failure
        if: failure()
        run: |
          echo '--- install.log'; cat install.log || true
          echo '--- server.log'; tail -n 200 server.log || true
